name: Go Build, Docker & MkDocs Deployment

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # Allows manual execution

# Cancel duplicate and superseded workflow runs to reduce CI cost
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # ensure we can rebase onto the latest main

      - name: Sync with origin/main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Build Linux and Windows binaries via build.ps1
        shell: pwsh
        run: ./build.ps1

      - name: Test Go Project
        shell: pwsh
        run: go test -v ./...

      - name: Commit and Push Binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # resource.syso is tracked and is regenerated by build.ps1 from
          # logo.ico, so any change to the icon leaves it modified here. Staging
          # only dist/ left it dirty, and the rebase below then refused with
          # "cannot rebase: You have unstaged changes" — which is how a logo
          # change silently stopped the binaries being published.
          git add dist/ resource.syso
          if ! git diff --cached --quiet; then
            git commit -m "Update binaries [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No changes to binaries, skipping commit"
          fi

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: 3270Connect-binaries
          path: |
            dist/3270Connect.exe
            dist/3270Connect_linux

  # The Linux image, published to GHCR.
  #
  # Every build and push step in this job used to be commented out, so the
  # image the installer and the compose stacks name did not exist: `docker
  # pull ghcr.io/3270io/3270connect` was a manifest-unknown error on a
  # documented command.
  #
  # A pull request builds without pushing, so a Dockerfile that no longer
  # builds is caught in review rather than on main.
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for GHCR push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/3270connect
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # linux/amd64 only: the s3270 the emulator drives is embedded in the
      # binary as an x86-64 ELF, so an arm64 image would serve the console and
      # then fail the first workflow it was asked to run.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Windows image is built from Dockerfile.windows and is not published
  # here: a Windows container image cannot be built on an ubuntu runner, and
  # the build job above already produces the Windows binary as a release asset.

  build-and-deploy-mkdocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python and Install MkDocs
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install --upgrade mkdocs-material pymdown-extensions mkdocs-simple-plugin

      - name: Build MkDocs Site
        run: |
          mkdocs build

      # Pull request builds validate that the docs still build, but must never
      # publish: on a pull_request event the checkout is the PR merge ref, so
      # deploying here overwrites the live site with an unmerged branch.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: 3270connect.3270.io


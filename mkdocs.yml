site_name: 3270Connect
# Doubles as the fallback <meta name="description"> and the og:description on
# any page without its own `description:` front matter, so it is written as a
# sentence a search result can show rather than a shelf label.
#
# It is only ever a fallback: every page carries its own `description:` and its
# own `seo_title:`, both unique across this site and the 3270Web one. A new
# page that omits them does not fail the build — it quietly ships a description
# identical to every other page that omitted them, which is the one thing a
# search engine penalises outright. Aim for 140-160 characters of description
# and 45-60 of title; beyond that a result row truncates.
site_description: >-
  Replay recorded IBM 3270 sessions as JSON workflows — headless in CI, fanned
  out across concurrent workers, with a live console and Prometheus metrics.
site_author: 3270.io
copyright: "© Since 2023 3270.io"
site_url: https://3270connect.3270.io
repo_url: https://github.com/3270io/3270Connect
repo_name: GitHub
edit_uri: edit/main/docs/
site_dir: site
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: en
  # No `logo:` key on purpose. Material renders that as <img>, which is its own
  # document and so cannot read the palette tokens. overrides/partials/logo.html
  # inlines the mark instead, so it re-tints with GRN/AMB/ICE/DAY.
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # Navigation and structure
    - navigation.instant
    - navigation.instant.progress
    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.footer
    # Search & content
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.integrate
    - content.tabs.link
    - content.footnotes
  # Colour is owned by docs/stylesheets/3270-theme.css, which ships the same
  # four palettes as 3270.io and the operations console (phosphor / amber /
  # ice / daylight). The GRN·AMB·ICE·DAY switch in the header replaces
  # Material's two-scheme toggle; `custom` keeps Material from emitting
  # primary/accent rules that would compete with ours.
  # `3270` is a deliberately unknown scheme name: Material ships no variable
  # block for it, so nothing competes with ours. (Material renders the scheme
  # onto <body>, where its own slate/default blocks would otherwise outrank
  # the html-level tokens by inheritance.) `custom` does the same for
  # primary/accent.
  palette:
    scheme: '3270'
    primary: custom
    accent: custom
  font:
    text: "Inter"
    code: "JetBrains Mono"

nav:
  - Home: index.md
  - Installation: installation.md
  - Basic Usage: basic-usage.md
  - Terminal UI: terminal-ui.md
  - Web Dashboard: dashboard.md
  - AI Chat Mode: ai-chat-mode.md
  - Chaos Mode: chaos-mode.md
  - Keyboard and Controls: keyboard-and-controls.md
  - Workflow Actions: workflow.md
  - Dynamic Field Injection: injection-config.md
  - Advanced Features: advanced-features.md
  - Metrics & Monitoring: metrics.md
  - MCP Server: mcp.md
  - Skills and Extensions: skills.md
  - Host Compatibility Profiler: host-profiler.md
  - Compatibility Profile Schema: compatibility-profile-schema.md
  - Reference:
      - Build Guide: BUILD.md
      - Makefile Quick Reference: MAKEFILE_QUICKREF.md
  - Acknowledgements: acknowledgements.md
  - License: LICENSE.md

plugins:
  - search
  - mkdocs-video:
      is_video: true
      video_autoplay: false
  - tags:
      enabled: true

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes

extra_css:
  # Shared 3270.io design system — keep first so extra.css can layer on it.
  - stylesheets/3270-theme.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/3270-theme.js

extra:
  version: 2.0.0
  CNAME: 3270.io
  generator: false
  # Short enough to sit next to the product name in a social card title, where
  # site_description would be cut off. overrides/main.html uses it for the home
  # page's og:title and for the preview image's alt text.
  tagline: replay the mainframe at any scale
  social:
    # Sibling sites first, so every page in the suite offers the same way back
    # out to 3270.io and across to the other tool's guide.
    - icon: material/home-variant
      link: https://3270.io
      name: 3270.io
    - icon: material/monitor-dashboard
      link: https://3270web.3270.io
      name: 3270Web documentation
    - icon: fontawesome/brands/github
      link: https://github.com/3270io
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/3270io
    - icon: fontawesome/brands/twitter
      link: https://x.com/3270io

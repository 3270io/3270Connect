<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 509 120" width="509" height="120" fill="none" role="img" aria-label="3270Connect">
  <g transform="translate(0 5) scale(1.25) translate(-21 -28.5)">
  <defs>
    <linearGradient id="3270connect-lk-face" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7cf9d0"/>
      <stop offset="1" stop-color="#4effb3"/>
    </linearGradient>
    <linearGradient id="3270connect-lk-spec" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="3270connect-lk-glow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- flood-color ignores var() as an attribute but honours it as CSS. -->
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.45" style="flood-color:#4effb3"/>
    </filter>
    <mask id="3270connect-lk-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g fill="#000">
      <path d="M52 59 62 69 52 79" fill="none" stroke="#000" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M67 59 77 69 67 79" fill="none" stroke="#000" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </mask>
    <clipPath id="3270connect-lk-face-clip">
      <rect x="30" y="46" width="70" height="46" rx="11"/>
    </clipPath>
  </defs>

  <!-- Receding planes: the sessions behind the one in front. -->
  <rect x="54" y="39" width="54" height="46" rx="9" fill="#4effb3" fill-opacity="0.2"/>
  <rect x="42" y="42.5" width="62" height="46" rx="10" fill="#4effb3" fill-opacity="0.38"/>

  <g filter="url(#3270connect-lk-glow)">
    <rect x="30" y="46" width="70" height="46" rx="11"
          fill="url(#3270connect-lk-face)" mask="url(#3270connect-lk-cut)"/>
  </g>

  <!-- Specular sweep, clipped to the front face. -->
  <g clip-path="url(#3270connect-lk-face-clip)">
    <path d="M30 46h70v20L30 84Z" fill="url(#3270connect-lk-spec)"/>
  </g>

  </g>
  <text y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="54" text-rendering="geometricPrecision">
    <tspan x="136" textLength="133.6" lengthAdjust="spacing" fill="#0b1a12" font-weight="700">3270</tspan><tspan textLength="233.79999999999998" lengthAdjust="spacing" fill="#4effb3" font-weight="500">Connect</tspan>
  </text>
</svg>
